name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install local package dependencies
        run: npm run setup:packages

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Audit backend dependencies
        run: npm --prefix backend audit --audit-level=high

      - name: Run backend tests
        run: npm --prefix backend test

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install local package dependencies
        run: npm run setup:packages

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build

  packages-test:
    name: Package Test & Audit (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - packages/note-format
          - packages/note-editor
          - packages/search-index
          - packages/label-kit
          - packages/ai-core
          - tools/instrument-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify Docker for search-index conformance test
        if: matrix.target == 'packages/search-index'
        run: |
          echo "Verifying Docker service for search-index..."
          docker info >/dev/null 2>&1 || sudo systemctl start docker
          docker --version

      - name: Test and audit ${{ matrix.target }}
        run: |
          if [ ! -f "${{ matrix.target }}/package.json" ]; then
            echo "${{ matrix.target }}/package.json not present; skipping."
            exit 0
          fi
          echo "Processing ${{ matrix.target }}..."
          npm run setup:packages
          if [ -f "${{ matrix.target }}/package-lock.json" ]; then
            npm --prefix ${{ matrix.target }} ci
          else
            npm --prefix ${{ matrix.target }} install
          fi
          npm --prefix ${{ matrix.target }} audit --audit-level=high
          npm --prefix ${{ matrix.target }} test

  e2e-test:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install local package dependencies
        run: npm run setup:packages

      - name: Install backend and frontend dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Install Playwright Chromium with system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: labhub:ci-test
